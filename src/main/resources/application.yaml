spring:
  application:
    name: ez-bank
  datasource:
    url: jdbc:postgresql://localhost:5432/bank
    username: bank
    password: bank
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: BankHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/migration/master-changelog.yaml